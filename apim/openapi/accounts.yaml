openapi: 3.0.1
info:
  title: AccountsAPI
  version: v1
  description: |
    Jamii Savings account balance lookup. Backed by WSO2 MI (data service over MySQL).
    Account numbers are 10 digits. Errors use the shared Jamii error envelope.
servers:
  - url: https://localhost:8243/accounts/v1
paths:
  /{accountNumber}/balance:
    get:
      summary: Get the balance of an account
      operationId: getAccountBalance
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: 10-digit account number
          schema:
            type: string
            pattern: '^[0-9]{10}$'
            example: '1000000001'
        - name: X-Correlation-ID
          in: header
          required: false
          description: Caller correlation ID; generated by the gateway if absent
          schema:
            type: string
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
              example:
                accountNumber: '1000000001'
                status: ACTIVE
                balance: { amount: 25450.75, currency: KES }
                requestId: a0a0b931-7394-4155-9c98-011777fd42d3
                timestamp: '2026-10-14T10:19:57.306Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    AccountBalance:
      type: object
      required: [accountNumber, status, balance, requestId, timestamp]
      properties:
        accountNumber: { type: string, example: '1000000001' }
        status: { type: string, enum: [ACTIVE, DORMANT, CLOSED] }
        balance:
          type: object
          required: [amount, currency]
          properties:
            amount: { type: number, format: double, example: 25450.75 }
            currency: { type: string, example: KES }
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, timestamp]
          properties:
            code: { type: string, example: ACCOUNT_NOT_FOUND }
            message: { type: string }
            requestId: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Malformed account number (INVALID_ACCOUNT_NUMBER)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown account (ACCOUNT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Database unavailable (DB_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
