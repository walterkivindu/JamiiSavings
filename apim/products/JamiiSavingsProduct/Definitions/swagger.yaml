openapi: 3.0.1
info:
  title: JamiiSavingsProduct
  description: "Jamii Savings: accounts, customers and loan eligibility as one subscribable product."
  version: v1
servers:
 -
  url: /
security:
 -
  default: []
paths:
  /{accountNumber}/balance:
    get:
      summary: Get the balance of an account
      operationId: getAccountBalance
      parameters:
       -
        name: accountNumber
        in: path
        description: 10-digit account number
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[0-9]{10}$"
          type: string
          example: "1000000001"
       -
        name: X-Correlation-ID
        in: header
        description: Caller correlation ID; generated by the gateway if absent
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
              example:
                accountNumber: "1000000001"
                status: ACTIVE
                balance:
                  amount: 25450.75
                  currency: KES
                requestId: a0a0b931-7394-4155-9c98-011777fd42d3
                timestamp: 2026-10-14T10:19:57.306Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /eligibility:
    post:
      summary: Check loan eligibility
      operationId: checkEligibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRequest"
            example:
              customerId: CUST-1001
              monthlyIncome: 120000
              monthlyObligations: 20000
              requestedAmount: 500000
              termMonths: 12
        required: true
      responses:
        "200":
          description: Eligibility decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResponse"
              example:
                customerId: CUST-1001
                eligible: true
                monthlyInstallment: 41667
                maxAffordableInstallment: 50000
                disposableIncome: 100000
                currency: KES
                reason: Monthly installment is within 50% of disposable income
                requestId: 9a7675c0-b728-4bc2-a21d-2b63693208b1
                timestamp: 2026-10-14T10:52:35.754Z
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /{customerId}:
    get:
      summary: Get a customer profile
      operationId: getCustomer
      parameters:
       -
        name: customerId
        in: path
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[0-9]{1,9}$"
          type: string
          example: "1"
       -
        name: X-Correlation-ID
        in: header
        description: "Caller correlation ID; echoed back, generated if absent"
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Customer found
          headers:
            X-Correlation-ID:
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
components:
  schemas:
    EligibilityRequest:
      required:
       - customerId
       - monthlyIncome
       - monthlyObligations
       - requestedAmount
       - termMonths
      type: object
      properties:
        customerId:
          type: string
          example: CUST-1001
        monthlyIncome:
          minimum: 0
          type: number
          description: KES per month
        monthlyObligations:
          minimum: 0
          type: number
          description: "Existing repayments, KES per month"
        requestedAmount:
          maximum: 1000000000000
          minimum: 1
          type: integer
          description: KES
        termMonths:
          maximum: 360
          minimum: 1
          type: integer
    EligibilityResponse:
      type: object
      properties:
        customerId:
          type: string
        eligible:
          type: boolean
        monthlyInstallment:
          type: number
        maxAffordableInstallment:
          type: number
        disposableIncome:
          type: number
        currency:
          type: string
          example: KES
        reason:
          type: string
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    Error:
      required:
       - error
      type: object
      properties:
        error:
          required:
           - code
           - message
           - requestId
           - timestamp
          type: object
          properties:
            code:
              type: string
              enum:
               - INVALID_CUSTOMER_ID
               - CUSTOMER_NOT_FOUND
               - BACKEND_ERROR
               - BACKEND_UNAVAILABLE
               - BACKEND_TIMEOUT
               - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
    AccountBalance:
      required:
       - accountNumber
       - balance
       - requestId
       - status
       - timestamp
      type: object
      properties:
        accountNumber:
          type: string
          example: "1000000001"
        status:
          type: string
          enum:
           - ACTIVE
           - DORMANT
           - CLOSED
        balance:
          required:
           - amount
           - currency
          type: object
          properties:
            amount:
              type: number
              format: double
              example: 25450.75
            currency:
              type: string
              example: KES
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    Customer:
      type: object
      properties:
        address:
          type: object
          properties:
            city:
              type: string
            geo:
              type: object
              properties:
                lat:
                  type: string
                lng:
                  type: string
            street:
              type: string
            suite:
              type: string
            zipcode:
              type: string
        company:
          type: object
          properties:
            bs:
              type: string
            catchPhrase:
              type: string
            name:
              type: string
        email:
          type: string
          format: email
        id:
          type: integer
          example: 1
        name:
          type: string
        phone:
          type: string
        username:
          type: string
        website:
          type: string
  responses:
    Error:
      description: Error in the shared Jamii envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed account number (INVALID_ACCOUNT_NUMBER)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown account (ACCOUNT_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Database unavailable (DB_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
          x-scopes-bindings: {}
