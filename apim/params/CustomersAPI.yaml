# apictl params for CustomersAPI: environment-specific overrides applied at import time.
environments:
  - name: dev
    configs:
      endpoints:
        production:
          url: http://mi:8290/customers
        sandbox:
          url: http://mi:8290/customers
      deploymentEnvironments:
        - displayOnDevportal: true
          deploymentEnvironment: Default
  - name: prod
    configs:
      endpoints:
        production:
          url: https://mi.prod.jamii.internal:8253/customers
        sandbox:
          url: https://mi.prod.jamii.internal:8253/customers
      deploymentEnvironments:
        - displayOnDevportal: true
          deploymentEnvironment: Default
