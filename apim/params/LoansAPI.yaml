# apictl params for LoansAPI: environment-specific overrides applied at import time.
environments:
  - name: dev
    configs:
      endpoints:
        production:
          url: http://mi:8290/loans
        sandbox:
          url: http://mi:8290/loans
      deploymentEnvironments:
        - displayOnDevportal: true
          deploymentEnvironment: Default
  - name: prod
    configs:
      endpoints:
        production:
          url: https://mi.prod.jamii.internal:8253/loans
        sandbox:
          url: https://mi.prod.jamii.internal:8253/loans
      deploymentEnvironments:
        - displayOnDevportal: true
          deploymentEnvironment: Default
