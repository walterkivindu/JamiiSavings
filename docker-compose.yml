services:
  mysql:
    image: mysql:8.0
    container_name: jamii-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: jamii
      MYSQL_USER: jamii
      MYSQL_PASSWORD: jamiipw
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujamii", "-pjamiipw"]
      interval: 5s
      timeout: 3s
      retries: 20

  mi:
    image: wso2/wso2mi:4.6.0
    container_name: jamii-mi
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Per-environment backend injection (read by endpoints via $SYSTEM:VAR)
      CUSTOMERS_BACKEND_URL: "${CUSTOMERS_BACKEND_URL:-https://jsonplaceholder.typicode.com/users/{uri.var.customerId}}"
      CALCULATOR_SOAP_URL: "${CALCULATOR_SOAP_URL:-http://www.dneonline.com/calculator.asmx}"
    ports:
      - "8290:8290"   # HTTP passthrough
      - "8253:8253"   # HTTPS passthrough
      - "9164:9164"   # Management API
    volumes:
      - ./target/JamiiSavings_1.0.0.car:/home/wso2carbon/wso2mi-4.6.0/repository/deployment/server/carbonapps/JamiiSavings_1.0.0.car:ro
      - ./mi/lib/mysql-connector-j.jar:/home/wso2carbon/wso2mi-4.6.0/lib/mysql-connector-j.jar:ro
      - ./deployment/deployment.toml:/home/wso2carbon/wso2mi-4.6.0/conf/deployment.toml:ro
      - ./mi/conf/log4j2.properties:/home/wso2carbon/wso2mi-4.6.0/conf/log4j2.properties:ro

  # API Manager 4.7.0 (all-in-one: Publisher, Dev Portal, Key Manager, Gateway).
  # Opt-in because it needs ~2-3 GB RAM:  docker compose --profile apim up -d
  apim:
    image: wso2/wso2am:4.7.0
    container_name: jamii-apim
    profiles: ["apim"]
    ports:
      - "9443:9443"   # Publisher / Dev Portal / Admin / REST APIs
      - "8243:8243"   # Gateway HTTPS
      - "8280:8280"   # Gateway HTTP
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9443/services/Version > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
